# ─── Payment Gateway ──────────────────────────────────────────────────────────
# Active profile controls which gateway adapter is loaded:
#   (default / no profile) → UpiPaymentGatewayAdapter  (mock/demo, immediate SUCCESS)
#   spring.profiles.active=razorpay → RazorpayPaymentGatewayAdapter (real Razorpay API)
#
# To switch to Razorpay:
#   1. Uncomment the three lines below
#   2. Replace the placeholder values with your Razorpay Dashboard credentials
#   3. Set spring.profiles.active=razorpay
#
spring.profiles.active=razorpay
razorpay.key.id=rzp_test_Tb2pJH2hbPPGB9
razorpay.key.secret=sAhKz89K3Sn9vWPC4PV8BRCx
razorpay.webhook.secret=
razorpay.currency=INR
# Frontend URL Razorpay redirects to after payment (replace with your domain in production)
razorpay.callback.frontend-url=http://localhost:5173
razorpay.callback.backend-url=http://localhost:8080

# ─── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of frontend origins allowed to call this API.
# Add your production domain here when deploying (no trailing slash).
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081

# ─── B2B GST Billing Module ───────────────────────────────────────────────────
# 2-digit GST state code of the platform's registered entity.
# 27 = Maharashtra (default).  Change to match your company's GSTIN first-2-digits.
billing.platform.state-code=27

# Supplier (platform) identity — printed on every tax invoice as the service provider.
billing.supplier.name=Clinical Study Platform Pvt Ltd
billing.supplier.gstin=27AAAAA0000A1Z5
billing.supplier.address=Level 5, Indiabulls Finance Centre, Mumbai 400013
billing.supplier.state=Maharashtra
billing.supplier.email=billing@clinicalportal.com

# SAC (Services Accounting Code) for the default service line item.
# 997331 = licensing of packaged software (medical/clinical).
billing.service.sac-code=997331
billing.service.description=Clinical Study Management Platform Access

# GSTIN validation endpoint.  Leave blank to use the offline mock adapter.

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

 # Set to TRACE temporarily to debug security issues; WARN is correct for normal operation
logging.level.org.springframework.security=WARN

# ─── H2 In-Memory Database (swap datasource for PostgreSQL/MySQL in production)

# Enable the H2 console
# Set the path to match your security rule

spring.h2.console.path=/h2-console

cors.allowed-origins=http://localhost:5174/
spring.datasource.url=jdbc:h2:file:./data/studydb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=




# ─── Schema and seed data are managed by schema.sql + data.sql ───────────────
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
server.error.include-message=always
server.error.include-exception=true

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=study-management


# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database (swap datasource for PostgreSQL/MySQL in production)
spring.datasource.url=jdbc:h2:mem:studydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=




# ─── Schema and seed data are managed by schema.sql + data.sql ───────────────
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
server.error.include-message=always
server.error.include-exception=true

# ─── H2 Console (http://localhost:8080/h2-console) ────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=study-management

# ─── Payment Gateway ──────────────────────────────────────────────────────────
# Active profile controls which gateway adapter is loaded:
#   (default / no profile) → UpiPaymentGatewayAdapter  (mock/demo, immediate SUCCESS)
#   spring.profiles.active=razorpay → RazorpayPaymentGatewayAdapter (real Razorpay API)
#
# To switch to Razorpay:
#   1. Uncomment the three lines below
#   2. Replace the placeholder values with your Razorpay Dashboard credentials
#   3. Set spring.profiles.active=razorpay
#
# spring.profiles.active=razorpay
# razorpay.key.id=rzp_test_XXXXXXXXXXXXXXXX
# razorpay.key.secret=XXXXXXXXXXXXXXXXXXXXXXXX
# razorpay.webhook.secret=XXXXXXXXXXXXXXXXXXXXXXXX
# razorpay.currency=INR

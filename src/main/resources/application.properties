# IAM credentials for Cognito Admin API (listUsersInGroup, adminGetUser).
# JWT validation does NOT need these — only the sync and confirmation-status endpoints do.
# Set these to an IAM user/role that has cognito-idp:ListUsersInGroup and cognito-idp:AdminGetUser.
# Leave blank to use env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) or ~/.aws/credentials.
app.cognito.access-key-id=
app.cognito.secret-access-key=

# Cognito Group names — must match exactly what is configured in the Cognito User Pool
app.cognito.groups.primary-investigator=primary_investigator
app.cognito.groups.co-investigator=co_investigator
app.cognito.groups.crc=crc
app.cognito.groups.cro=cro
app.cognito.groups.hospital=hospital
app.cognito.groups.subject=subject
